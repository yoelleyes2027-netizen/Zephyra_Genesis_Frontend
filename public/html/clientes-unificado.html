<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes - CRM</title>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/all.min.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    .client-edit-modal {
      position: fixed;
      inset: 0;
      z-index: 1050;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .client-edit-modal.d-none {
      display: none !important;
    }

    .client-edit-modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 13, 28, 0.68);
      backdrop-filter: blur(4px);
    }

    .client-edit-modal__panel {
      position: relative;
      width: min(940px, 100%);
      max-height: 90vh;
      overflow: auto;
      border: 0;
      border-radius: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="dashboard-container container">
    <div class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo" onclick="window.location.href='./adminUsuario.html'">G</div>
      <h1 class="mb-0">
        <i class="fas fa-user pe-2"></i>Gestión de Clientes
      </h1>
    </div>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Alta</h2>
      <form id="cliente-form" class="row g-3">
        <div class="col-md-4">
          <label for="cliente-name" class="form-label">Nombre</label>
          <input id="cliente-name" class="form-control" placeholder="Nombre" required>
        </div>
        <div class="col-md-4">
          <label for="cliente-email" class="form-label">Email</label>
          <input id="cliente-email" type="email" class="form-control" placeholder="Email">
        </div>
        <div class="col-md-4">
          <label for="cliente-telefono" class="form-label">Teléfono</label>
          <input id="cliente-telefono" type="number" class="form-control" placeholder="Teléfono">
        </div>
        <div class="col-12 d-flex gap-2">
          <button id="cliente-submit" class="btn btn-primary" type="submit">Guardar cliente</button>
          <button id="cliente-cancelar" class="btn btn-outline-secondary" type="button">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Buscar / editar</h2>
      <div class="row g-2 align-items-end">
        <div class="col-md-6">
          <label for="cliente-busqueda" class="form-label">Buscar</label>
          <input id="cliente-busqueda" class="form-control" placeholder="Email o nombre">
        </div>
        <div class="col-md-3 form-check form-switch ms-2">
          <input id="cliente-por-nombre" class="form-check-input" type="checkbox">
          <label class="form-check-label ms-2" for="cliente-por-nombre">Buscar por nombre</label>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button id="cliente-buscar" class="btn btn-light w-100" type="button">Buscar</button>
          <button id="cliente-ver-todos" class="btn btn-outline-light w-100" type="button">Ver todos</button>
        </div>
      </div>

      <div class="table-responsive mt-4">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Fecha creación</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cliente-body"></tbody>
        </table>
      </div>
    </section>

    <div id="cliente-edit-modal" class="client-edit-modal d-none" aria-hidden="true">
      <div class="client-edit-modal__backdrop" data-cliente-close></div>
      <div class="client-edit-modal__panel card shadow-lg">
        <div class="card-header d-flex align-items-center justify-content-between">
          <div>
            <h3 class="h5 mb-0">Editar cliente</h3>
            <small class="text-muted">Modifica los campos y guarda los cambios</small>
          </div>
          <button type="button" class="btn-close" aria-label="Cerrar" data-cliente-close></button>
        </div>
        <form id="cliente-edit-form">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="cliente-edit-name" class="form-label">Nombre</label>
                <input id="cliente-edit-name" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label for="cliente-edit-email" class="form-label">Email</label>
                <input id="cliente-edit-email" type="email" class="form-control">
              </div>
              <div class="col-md-4">
                <label for="cliente-edit-telefono" class="form-label">Teléfono</label>
                <input id="cliente-edit-telefono" type="number" class="form-control">
              </div>
            </div>
          </div>
          <div class="card-footer d-flex gap-2 justify-content-end">
            <button type="button" class="btn btn-light" data-cliente-close>Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center mt-4 mb-4">
      <button class="btn btn-secondary px-4 py-2" onclick="window.location.href='./adminUsuario.html'">← Ir para atrás</button>
    </div>
  </div>

  <script src="../js/clientes-unificado.js"></script>
</body>
</html>
