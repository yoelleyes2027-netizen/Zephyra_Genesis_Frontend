<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empresa - Genesis</title>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    .company-edit-modal {
      position: fixed;
      inset: 0;
      z-index: 1050;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .company-edit-modal.d-none {
      display: none !important;
    }

    .company-edit-modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 13, 28, 0.68);
      backdrop-filter: blur(4px);
    }

    .company-edit-modal__panel {
      position: relative;
      width: min(940px, 100%);
      max-height: 90vh;
      overflow: auto;
      border: 0;
      border-radius: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="dashboard-container container">
    <div class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo" onclick="window.location.href='./adminUsuario.html'">G</div>
      <h1 class="mb-0">Gestión de Empresa</h1>
    </div>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Alta</h2>
      <form id="empresa-form" class="row g-3">
        <div class="col-md-4">
          <label for="empresa-name" class="form-label">Nombre</label>
          <input id="empresa-name" class="form-control" placeholder="Nombre" required>
        </div>
        <div class="col-md-4">
          <label for="empresa-email" class="form-label">Email</label>
          <input id="empresa-email" type="email" class="form-control" placeholder="Email">
        </div>
        <div class="col-md-4">
          <label for="empresa-telefono" class="form-label">Teléfono</label>
          <input id="empresa-telefono" type="number" class="form-control" placeholder="Teléfono">
        </div>
        <div class="col-md-3">
          <label for="empresa-documento" class="form-label">Número documento</label>
          <input id="empresa-documento" class="form-control" placeholder="Número documento" required>
        </div>
        <div class="col-md-3">
          <label for="empresa-tipo-documento" class="form-label">Tipo documento</label>
          <select id="empresa-tipo-documento" class="form-select" required>
            <option value="RUT" selected>RUT</option>
            <option value="RUC">RUC</option>
            <option value="CI">CI</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="empresa-razon-social" class="form-label">Razón social</label>
          <input id="empresa-razon-social" class="form-control" placeholder="Razón social" required>
        </div>
        <div class="col-md-3">
          <label for="empresa-direccion" class="form-label">Dirección</label>
          <input id="empresa-direccion" class="form-control" placeholder="Dirección" required>
        </div>
        <div class="col-12 d-flex gap-2">
          <button id="empresa-submit" class="btn btn-primary" type="submit">Guardar empresa</button>
          <button id="empresa-cancelar" class="btn btn-outline-secondary" type="button">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Buscar / editar</h2>
      <div class="row g-2 align-items-end">
        <div class="col-md-5">
          <label for="empresa-busqueda" class="form-label">Buscar</label>
          <input id="empresa-busqueda" class="form-control" placeholder="Documento o razón social">
        </div>
        <div class="col-md-3">
          <label for="empresa-buscar-por" class="form-label">Buscar por</label>
          <select id="empresa-buscar-por" class="form-select">
            <option value="documento">Documento</option>
            <option value="razon">Razón social</option>
          </select>
        </div>
        <div class="col-md-4 d-flex gap-2">
          <button id="empresa-buscar" class="btn btn-light w-100">Buscar</button>
          <button id="empresa-ver-todos" class="btn btn-outline-light w-100" type="button">Ver todos</button>
        </div>
      </div>

      <div class="table-responsive mt-4">
        <table class="table table-hover align-middle">
          <thead><tr><th>Nombre</th><th>Documento</th><th>Razón social</th><th>Teléfono</th><th>Email</th><th>Dirección</th><th>Acciones</th></tr></thead>
          <tbody id="empresa-body"></tbody>
        </table>
      </div>
    </section>

    <div id="empresa-edit-modal" class="company-edit-modal d-none" aria-hidden="true">
      <div class="company-edit-modal__backdrop" data-empresa-close></div>
      <div class="company-edit-modal__panel card shadow-lg">
        <div class="card-header d-flex align-items-center justify-content-between">
          <div>
            <h3 class="h5 mb-0">Editar empresa</h3>
            <small class="text-muted">Modifica los campos y guarda los cambios</small>
          </div>
          <button type="button" class="btn-close" aria-label="Cerrar" data-empresa-close></button>
        </div>
        <form id="empresa-edit-form">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4"><label for="empresa-edit-name" class="form-label">Nombre</label><input id="empresa-edit-name" class="form-control" required></div>
              <div class="col-md-4"><label for="empresa-edit-email" class="form-label">Email</label><input id="empresa-edit-email" type="email" class="form-control"></div>
              <div class="col-md-4"><label for="empresa-edit-telefono" class="form-label">Teléfono</label><input id="empresa-edit-telefono" type="number" class="form-control"></div>
              <div class="col-md-3"><label for="empresa-edit-documento" class="form-label">Número documento</label><input id="empresa-edit-documento" class="form-control" required></div>
              <div class="col-md-3"><label for="empresa-edit-tipo-documento" class="form-label">Tipo documento</label><select id="empresa-edit-tipo-documento" class="form-select" required><option value="RUT" selected>RUT</option><option value="RUC">RUC</option><option value="CI">CI</option></select></div>
              <div class="col-md-3"><label for="empresa-edit-razon-social" class="form-label">Razón social</label><input id="empresa-edit-razon-social" class="form-control" required></div>
              <div class="col-md-3"><label for="empresa-edit-direccion" class="form-label">Dirección</label><input id="empresa-edit-direccion" class="form-control" required></div>
            </div>
          </div>
          <div class="card-footer d-flex gap-2 justify-content-end">
            <button type="button" class="btn btn-light" data-empresa-close>Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-secondary px-4 py-2" onclick="window.location.href='./adminUsuario.html'">← Ir para atrás</button>
    </div>
  </div>
  <script src="../js/empresa.js"></script>
</body>
</html>
