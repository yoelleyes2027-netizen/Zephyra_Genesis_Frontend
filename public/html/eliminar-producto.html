<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliminar Producto</title>

  <!-- Bootstrap y estilos del sistema -->
  <link rel="stylesheet" href="../css/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/all.min.css" />
  <link rel="stylesheet" href="../css/eliminar-producto.css" />
</head>

<body>
  <div class="dashboard-container container d-flex flex-fill flex-column justify-content-center">

    <div class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo">G</div>
      <h1 class="mb-0">Eliminar Producto</h1>
    </div>

    <!-- Formulario para buscar producto -->
    <section class="dashboard-section d-flex flex-column justify-content-center mx-auto" style="min-width: 80%;">
      <h2 class="mb-2"><i class="fas fa-search"></i> Buscar producto</h2>
      <form id="formBuscar" class="d-flex flex-fill flex-column">
        <div class="mb-4">
          <label for="codigoBuscar" class="form-label"></label>
          <input type="text" id="codigoBuscar" class="form-control" placeholder="Código" required />
        </div>

        <div class="d-flex align-items-center justify-content-center mx-auto" style="min-width: 20%;">
          <button type="submit" class=" d-flex justify-content-center btn boton-producto w-100"
            style="padding-top: 10px !important; padding-bottom: 10px !important;">
            <i class="d-flex justify-content-centerfas fas fa-search"></i> Buscar
          </button>
        </div>
      </form>
    </section>

    <!-- Producto encontrado -->
    <section id="productoInfo" class="dashboard-section d-flex justify-content-center mx-auto mt-4"
      style="min-width: 80%; display: none !important">
      <div style="width: 100%;" class="d-flex flex-column justify-content-center">
        <h2 class="d-flex justify-content-center" style="font-size: 25px;">Informacion del Producto</h2>
        <div class="producto-info-box">
          <p style="font-size: 20px"><strong>Código:</strong> <span id="codigo"></span></p>
          <p style="font-size: 20px"><strong>Descripción:</strong> <span id="descripcion"></span></p>
          <p style="font-size: 20px"><strong>Precio de venta:</strong> <span id="precio_venta"></span></p>
          <p style="font-size: 20px"><strong>Precio de compra:</strong> <span id="precio_compra"></span></p>
          <p style="font-size: 20px"><strong>Stock:</strong> <span id="stock"></span></p>
          <p style="font-size: 20px"><strong>Unidad de medida:</strong> <span id="unidad_medida"></span></p>
          <p style="font-size: 20px"><strong>Etiqueta:</strong> <span id="etiqueta"></span></p>
          <p style="font-size: 20px"><strong>Proveedor:</strong> <span id="proveedor"></span></p>
          <p style="font-size: 20px"><strong>Código de barras:</strong> <span id="cod_barra"></span></p>
        </div>
      </div>
    </section>

    <section id="boton-eliminar-producto" class="dashboard-section d-flex flex-column justify-content-center mx-auto"
      style="min-width: 80%; display: none !important">
      <div class="d-flex justify-content-center">
        <button id="btnEliminar" class="btn boton-producto d-flex justify-content-center">
          <i class="fas fa-trash"></i> Eliminar Producto
        </button>
      </div>
    </section>

    <p id="mensaje" class="text-center"></p>
  </div>

  <script src="../js/eliminar-producto.js"></script>
</body>

</html>
