<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajas - Genesis</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
  <main class="dashboard-container container">
    <header class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo" aria-hidden="true">G</div>
      <h1 class="mb-0">Cajas</h1>
    </header>

    <section class="dashboard-section">
      <h2 class="mb-2">Operaciones de caja</h2>
      <p id="estado-caja" class="text-muted mb-3">Para operar, primero debes abrir caja.</p>
      <div class="dashboard-menu d-flex flex-wrap gap-3 mb-3">
        <button id="btn-abrir-caja" class="btn btn-light shadow-sm flex-fill" type="button">
          <i class="fas fa-box-open" aria-hidden="true"></i> Abrir caja
        </button>
      </div>
      <div class="dashboard-menu d-flex flex-wrap gap-3">
        <button id="btn-cortar-ticket" class="btn btn-light shadow-sm flex-fill" type="button" disabled>
          <i class="fas fa-cart-shopping" aria-hidden="true"></i> Cortar ticket
        </button>
        <button id="btn-devolver-ticket" class="btn btn-light shadow-sm flex-fill" type="button" disabled>
          <i class="fas fa-rotate-left" aria-hidden="true"></i> Devolver ticket
        </button>
        <button id="btn-devolucion-caja" class="btn btn-light shadow-sm flex-fill" type="button" disabled>
          <i class="fas fa-arrow-rotate-left" aria-hidden="true"></i> Devolución por caja
        </button>
        <button id="btn-cerrar-caja" class="btn btn-light shadow-sm flex-fill" type="button" disabled>
          <i class="fas fa-cash-register" aria-hidden="true"></i> Cerrar caja
        </button>
      </div>
    </section>

    <footer class="dashboard-footer">
      <button id="btn-volver" class="btn dashboard-logout" type="button"><i class="fas fa-arrow-left" aria-hidden="true"></i> Volver</button>
    </footer>
  </main>

  <script src="../js/cajas.js"></script>
</body>

</html>
