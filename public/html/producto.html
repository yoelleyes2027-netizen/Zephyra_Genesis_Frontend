<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Genesis</title>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    .product-edit-modal {
      position: fixed;
      inset: 0;
      z-index: 1050;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .product-edit-modal.d-none {
      display: none !important;
    }

    .product-edit-modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 13, 28, 0.68);
      backdrop-filter: blur(4px);
    }

    .product-edit-modal__panel {
      position: relative;
      width: min(980px, 100%);
      max-height: 90vh;
      overflow: auto;
      border: 0;
      border-radius: 1.25rem;
    }
  </style>
</head>
<body>
  <script>
    function volverAlPanel() {
      window.location.href = new URLSearchParams(window.location.search).get('origen') === 'recepcion'
        ? './recepcion.html'
        : './adminUsuario.html';
    }
  </script>
  <div class="dashboard-container container">
    <div class="dashboard-header d-flex align-items-center justify-content-between">
      <button class="logo border-0" type="button" aria-label="Volver al panel" onclick="volverAlPanel()">G</button>
      <h1 class="mb-0">Gestión de Productos</h1>
    </div>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Alta</h2>
      <form id="producto-form" class="row g-3">
        <div class="col-md-3">
          <label for="producto-codigo" class="form-label">Código de barras</label>
          <input id="producto-codigo" type="number" class="form-control" placeholder="Código de barras" required>
        </div>
        <div class="col-md-5">
          <label for="producto-descripcion" class="form-label">Descripción</label>
          <input id="producto-descripcion" class="form-control" placeholder="Descripción" required>
        </div>
        <div class="col-md-2">
          <label for="producto-stock" class="form-label">Stock</label>
          <input id="producto-stock" type="number" class="form-control" placeholder="Stock" required>
        </div>
        <div class="col-md-2">
          <label for="producto-unidad" class="form-label">Unidad de medida</label>
          <select id="producto-unidad" class="form-select" required>
            <option value="KILOGRAMO">KILOGRAMO</option>
            <option value="LITRO">LITRO</option>
            <option value="UNIDAD" selected>UNIDAD</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="producto-precio-venta" class="form-label">Precio venta</label>
          <input id="producto-precio-venta" type="number" step="0.01" class="form-control" placeholder="Precio venta" required>
        </div>
        <div class="col-md-3">
          <label for="producto-precio-compra" class="form-label">Precio compra</label>
          <input id="producto-precio-compra" type="number" step="0.01" class="form-control" placeholder="Precio compra" required>
        </div>
        <div class="col-md-3">
          <label for="producto-etiqueta" class="form-label">Etiqueta</label>
          <input id="producto-etiqueta" class="form-control" placeholder="Etiqueta" required>
        </div>
        <div class="col-md-3">
          <label for="producto-proveedor" class="form-label">Proveedor</label>
          <select id="producto-proveedor" class="form-select" required>
            <option value="" selected disabled>Seleccione proveedor</option>
          </select>
          <small class="form-text text-muted d-block mt-1">Se muestra el documento y la razón social reales del proveedor.</small>
        </div>
        <div class="col-12 d-flex gap-2">
          <button id="producto-submit" class="btn btn-primary" type="submit">Guardar producto</button>
          <button id="producto-cancelar" class="btn btn-outline-secondary" type="button">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Buscar / editar</h2>
      <div class="row g-2 align-items-end">
        <div class="col-md-5">
          <label for="producto-busqueda" class="form-label">Buscar</label>
          <input id="producto-busqueda" class="form-control" placeholder="Código, descripción o etiqueta">
        </div>
        <div class="col-md-3">
          <label for="producto-buscar-por" class="form-label">Buscar por</label>
          <select id="producto-buscar-por" class="form-select">
            <option value="codigo">Código de barras</option>
            <option value="descripcion">Descripción</option>
            <option value="etiqueta">Etiqueta</option>
          </select>
        </div>
        <div class="col-md-4 d-flex gap-2">
          <button id="producto-buscar" class="btn btn-light w-100">Buscar</button>
          <button id="producto-ver-todos" class="btn btn-outline-light w-100" type="button">Ver todos</button>
        </div>
      </div>

      <div class="table-responsive mt-4">
        <table class="table table-hover align-middle">
          <thead id="producto-head">
            <tr><th>Código</th><th>Descripción</th><th>Precio venta</th><th>Precio compra</th><th>Stock</th><th>Unidad</th><th>Etiqueta</th><th>Proveedor</th><th>Acciones</th></tr>
          </thead>
          <tbody id="producto-body"></tbody>
        </table>
      </div>
    </section>

    <div id="producto-edit-modal" class="product-edit-modal d-none" aria-hidden="true">
      <div class="product-edit-modal__backdrop" data-producto-close></div>
      <div class="product-edit-modal__panel card shadow-lg">
        <div class="card-header d-flex align-items-center justify-content-between">
          <div>
            <h3 class="h5 mb-0">Editar producto</h3>
            <small class="text-muted">Modifica los campos y guarda los cambios</small>
          </div>
          <button type="button" class="btn-close" aria-label="Cerrar" data-producto-close></button>
        </div>
        <form id="producto-edit-form">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label for="producto-edit-codigo" class="form-label">Código de barras</label>
                <input id="producto-edit-codigo" type="number" class="form-control" required>
              </div>
              <div class="col-md-5">
                <label for="producto-edit-descripcion" class="form-label">Descripción</label>
                <input id="producto-edit-descripcion" class="form-control" required>
              </div>
              <div class="col-md-2">
                <label for="producto-edit-stock" class="form-label">Stock</label>
                <input id="producto-edit-stock" type="number" class="form-control" required>
              </div>
              <div class="col-md-2">
                <label for="producto-edit-unidad" class="form-label">Unidad de medida</label>
                <select id="producto-edit-unidad" class="form-select" required>
                  <option value="KILOGRAMO">KILOGRAMO</option>
                  <option value="LITRO">LITRO</option>
                  <option value="UNIDAD">UNIDAD</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="producto-edit-precio-venta" class="form-label">Precio venta</label>
                <input id="producto-edit-precio-venta" type="number" step="0.01" class="form-control" required>
              </div>
              <div class="col-md-3">
                <label for="producto-edit-precio-compra" class="form-label">Precio compra</label>
                <input id="producto-edit-precio-compra" type="number" step="0.01" class="form-control" required>
              </div>
              <div class="col-md-3">
                <label for="producto-edit-etiqueta" class="form-label">Etiqueta</label>
                <input id="producto-edit-etiqueta" class="form-control" required>
              </div>
              <div class="col-md-3">
                <label for="producto-edit-proveedor" class="form-label">Proveedor</label>
                <select id="producto-edit-proveedor" class="form-select" required>
                  <option value="" selected disabled>Seleccione proveedor</option>
                </select>
              </div>
            </div>
          </div>
          <div class="card-footer d-flex gap-2 justify-content-end">
            <button type="button" class="btn btn-light" data-producto-close>Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-secondary px-4 py-2" onclick="volverAlPanel()">← Ir para atrás</button>
    </div>
  </div>
  <script src="../js/producto.js"></script>
</body>
</html>
