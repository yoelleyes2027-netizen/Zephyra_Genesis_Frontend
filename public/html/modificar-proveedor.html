<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modificar Proveedor</title>

  <!-- Bootstrap y estilos del sistema -->
  <link rel="stylesheet" href="../css/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/all.min.css" />
  <link rel="stylesheet" href="../css/modificar-proveedor.css" />
</head>

<body>
  <div class="dashboard-container container d-flex flex-fill flex-column justify-content-center">

    <!-- Encabezado -->
    <div class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo">G</div>
      <h1 class="mb-0">
        <i class="fas fa-pen"></i> Modificar Proveedor
      </h1>
    </div>

    <!-- Buscador -->
    <section class="dashboard-section d-flex flex-column justify-content-center mx-auto" style="min-width: 80%;">
      <h2 class="mb-2"><i class="fas fa-search"></i> Buscar proveedor</h2>

      <form id="formBuscar" class="d-flex flex-fill flex-column">
        <div class="mb-4">
          <label for="documentoBuscar" class="form-label"></label>
          <input type="text" id="documentoBuscar" class="form-control" placeholder="Documento del proveedor" required />
        </div>

        <div class="d-flex align-items-center justify-content-center mx-auto" style="min-width: 20%;">
          <button type="submit" class="btn boton-producto w-100" style="padding-top: 10px !important; padding-bottom: 10px !important;">
            <i class="fas fa-search"></i> Buscar
          </button>
        </div>
      </form>
    </section>

    <!-- Formulario de modificación -->
    <section class="dashboard-section d-flex justify-content-center mx-auto mt-4" style="min-width: 80%;">
      <form id="formModificar" class="d-flex flex-fill flex-column" style="max-width: 90%; display: none;">
        <div class="mb-3">
          <label for="nombre" class="form-label d-flex justify-content-center mb-1" style="color: black !important; font-size: 18px;">Nombre</label>
          <input type="text" id="nombre" class="form-control" required />
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label d-flex justify-content-center mb-1" style="color: black !important; font-size: 18px;">Teléfono</label>
          <input type="text" id="telefono" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label d-flex justify-content-center mb-1" style="color: black !important; font-size: 18px;">Email</label>
          <input type="email" id="email" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="direccion" class="form-label d-flex justify-content-center mb-1" style="color: black !important; font-size: 18px;">Dirección</label>
          <input type="text" id="direccion" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="denominacion" class="form-label d-flex justify-content-center mb-1" style="color: black !important; font-size: 18px;">Denominación</label>
          <input type="text" id="denominacion" class="form-control" />
        </div>

        <!-- Mensaje -->
        <div id="mensaje" class="mt-3"></div>
      </form>
    </section>

    <!-- Botón -->
    <section class="dashboard-section d-flex justify-content-center mx-auto mt-4 py-3" style="min-width: 80%;">
      <div>
        <button id="modificar-proveedor-boton" type="submit" form="formModificar" class="btn boton-producto w-100">
          <i class="fas fa-pen"></i> Actualizar Proveedor
        </button>
      </div>
    </section>
  </div>

  <script src="../js/modificar-proveedor.js"></script>
</body>

</html>
