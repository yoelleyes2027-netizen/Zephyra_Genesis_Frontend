<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedores - Genesis</title>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="dashboard-container container">
    <div class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo" onclick="window.location.href='./adminUsuario.html'">G</div>
      <h1 class="mb-0">Gestión de Proveedores</h1>
    </div>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Alta / edición</h2>
      <form id="proveedor-form" class="row g-3">
        <div class="col-md-4"><input id="proveedor-name" class="form-control" placeholder="Nombre" required></div>
        <div class="col-md-4"><input id="proveedor-email" type="email" class="form-control" placeholder="Email"></div>
        <div class="col-md-4"><input id="proveedor-telefono" type="number" class="form-control" placeholder="Teléfono"></div>
        <div class="col-md-3"><input id="proveedor-documento" class="form-control" placeholder="Número documento" required></div>
        <div class="col-md-3"><input id="proveedor-tipo-documento" class="form-control" placeholder="Tipo documento" value="RUC" required></div>
        <div class="col-md-3"><input id="proveedor-razon-social" class="form-control" placeholder="Razón social" required></div>
        <div class="col-md-3"><input id="proveedor-direccion" class="form-control" placeholder="Dirección" required></div>
        <div class="col-12 d-flex gap-2">
          <button id="proveedor-submit" class="btn btn-primary" type="submit">Guardar proveedor</button>
          <button id="proveedor-cancelar" class="btn btn-outline-secondary" type="button">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Buscar / listar</h2>
      <div class="row g-2 align-items-end">
        <div class="col-md-6"><input id="proveedor-busqueda" class="form-control" placeholder="Documento o razón social"></div>
        <div class="col-md-3 form-check form-switch ms-2">
          <input id="proveedor-por-razon" class="form-check-input" type="checkbox">
          <label class="form-check-label ms-2" for="proveedor-por-razon">Buscar por razón social</label>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button id="proveedor-buscar" class="btn btn-light w-100">Buscar</button>
          <button id="proveedor-ver-todos" class="btn btn-outline-light w-100" type="button">Ver todos</button>
        </div>
      </div>

      <div class="table-responsive mt-4">
        <table class="table table-hover align-middle">
          <thead><tr><th>Nombre</th><th>Documento</th><th>Razón social</th><th>Teléfono</th><th>Email</th><th>Dirección</th><th>Acciones</th></tr></thead>
          <tbody id="proveedor-body"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="../js/proveedores.js"></script>
</body>
</html>
