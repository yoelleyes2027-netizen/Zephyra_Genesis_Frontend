<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedores - Genesis</title>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="dashboard-container container">
    <div class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo" onclick="window.location.href='./adminUsuario.html'">G</div>
      <h1 class="mb-0">Gestión de Proveedores</h1>
    </div>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Alta</h2>
      <form id="proveedor-form" class="row g-3">
        <div class="col-md-4">
          <label for="proveedor-name" class="form-label">Nombre</label>
          <input id="proveedor-name" class="form-control" placeholder="Nombre" required>
        </div>
        <div class="col-md-4">
          <label for="proveedor-email" class="form-label">Email</label>
          <input id="proveedor-email" type="email" class="form-control" placeholder="Email">
        </div>
        <div class="col-md-4">
          <label for="proveedor-telefono" class="form-label">Teléfono</label>
          <input id="proveedor-telefono" type="number" class="form-control" placeholder="Teléfono">
        </div>
        <div class="col-md-3">
          <label for="proveedor-documento" class="form-label">Número documento</label>
          <input id="proveedor-documento" class="form-control" placeholder="Número documento" required>
        </div>
        <div class="col-md-3">
          <label for="proveedor-tipo-documento" class="form-label">Tipo documento</label>
          <select id="proveedor-tipo-documento" class="form-select" required>
            <option value="RUT">RUT</option>
            <option value="RUC" selected>RUC</option>
            <option value="CI">CI</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="proveedor-razon-social" class="form-label">Razón social</label>
          <input id="proveedor-razon-social" class="form-control" placeholder="Razón social" required>
        </div>
        <div class="col-md-3">
          <label for="proveedor-direccion" class="form-label">Dirección</label>
          <input id="proveedor-direccion" class="form-control" placeholder="Dirección" required>
        </div>
        <div class="col-12 d-flex gap-2">
          <button id="proveedor-submit" class="btn btn-primary" type="submit">Guardar proveedor</button>
          <button id="proveedor-cancelar" class="btn btn-outline-secondary" type="button">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Buscar / editar</h2>
      <div class="row g-2 align-items-end">
        <div class="col-md-5">
          <label for="proveedor-busqueda" class="form-label">Buscar</label>
          <input id="proveedor-busqueda" class="form-control" placeholder="Documento o razón social">
        </div>
        <div class="col-md-3">
          <label for="proveedor-buscar-por" class="form-label">Buscar por</label>
          <select id="proveedor-buscar-por" class="form-select">
            <option value="documento">Documento</option>
            <option value="razon">Razón social</option>
          </select>
        </div>
        <div class="col-md-4 d-flex gap-2">
          <button id="proveedor-buscar" class="btn btn-light w-100">Buscar</button>
          <button id="proveedor-ver-todos" class="btn btn-outline-light w-100" type="button">Ver todos</button>
        </div>
      </div>

      <div class="table-responsive mt-4">
        <table class="table table-hover align-middle">
          <thead><tr><th>Nombre</th><th>Documento</th><th>Razón social</th><th>Teléfono</th><th>Email</th><th>Dirección</th><th>Acciones</th></tr></thead>
          <tbody id="proveedor-body"></tbody>
        </table>
      </div>
    </section>

    <div class="text-center mt-4">
      <button class="btn btn-secondary px-4 py-2" onclick="window.location.href='./adminUsuario.html'">← Ir para atrás</button>
    </div>
  </div>
  <script src="../js/proveedores.js"></script>
</body>
</html>
