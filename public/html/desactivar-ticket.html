<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Desactivar Ticket</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/desactivar-ticket.css" />
</head>

<body>
  <div class="container">
    <h1>Desactivar Ticket</h1>

    <label for="ticket-id">Número de Ticket:</label>
    <input type="number" id="ticket-id" placeholder="Ingrese el ID del ticket" />

    <button id="btn-buscar">Buscar Ticket</button>

    <p id="mensaje" class="mensaje"></p>

    <div id="datos-ticket" style="display: none;">
      <h3>Datos del Ticket</h3>
      <p><strong>Tipo de Ticket:</strong> <span id="Tipo-ticket-label"></span></p>
      <p><strong>ID:</strong> <span id="ticket-id-label"></span></p>
      <p><strong>Cliente:</strong> <span id="cliente-label"></span></p>
      <p><strong>Fecha y hora:</strong> <span id="fecha-label"></span></p>
      <p><strong>Total:</strong> <span id="total-label"></span></p>
      <p><strong>Forma de pago:</strong> <span id="forma-label"></span></p>
      <p><strong>Moneda:</strong> <span id="moneda-label"></span></p>
      <p><strong>Tipo de pago:</strong> <span id="tipo-label"></span></p>
      <p><strong>Usuario:</strong> <span id="usuario-label"></span></p>
    </div>

    <div id="lista-articulos" style="display: none;">
      <h3>Artículos</h3>
      <table id="articulos" class="tabla-articulos" style="width: 100%;">
        <thead>
          <tr>
            <th>Descripción</th>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>Devolver</th>
          </tr>
        </thead>
        <tbody id="articulos-body">
          <!-- Las filas se llenan por JS -->
        </tbody>
      </table>
    </div>

    <button id="btn-anular" style="display: none;">❌ Devolver Ticket Completo</button>
    <button id="btn-eliminar-seleccionados" style="display: none;">
      🗑️ Eliminar artículos seleccionados
    </button>
  </div>

  <script src="../js/desactivar-ticket.js"></script>
</body>

</html>
