<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proveedores - CRM</title>

  <!-- Bootstrap + FontAwesome -->
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/proveedores-unificado.css">
</head>

<body>
  <div class="dashboard-container container">
    <!-- Encabezado -->
    <div class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo">G</div>
      <h1 class="mb-0">
        <i class="fas fa-truck pe-2"></i>Gestión de Proveedores
      </h1>
    </div>

    <section class="dashboard-section mb-4 py-3" style="margin: 0px">
      <div class="d-flex align-items-center justify-content-center gap-3">
        <button id="agregar-proveedor-boton" onclick="window.location.href='./registrar-proveedor.html'"
          class="btn boton-producto">
          <i class="fas fa-user-plus"></i> Agregar proveedor
        </button>
        <button id="modificar-proveedor-boton" onclick="window.location.href='./modificar-proveedor.html'"
          class="btn boton-producto">
          <i class="fas fa-edit"></i> Modificar proveedor
        </button>
        <button id="eliminar-proveedor-boton" onclick="window.location.href='./eliminar-proveedor.html'" class="btn">
          <i class="fas fa-user-times"></i> Eliminar proveedor
        </button>
      </div>
    </section>

    <!-- Buscador -->
    <section class="dashboard-section mb-4 py-3">
      <h2 class="mb-4 mt-3"><i class="fas fa-search"></i> Buscar Proveedor</h2>

      <div class="d-flex flex-column gap-3">
        <!-- Campo de texto -->
        <input type="text" id="documento-input" class="form-control py-1" style="font-size: 18px !important;"
          placeholder="Número de documento o Razón social" />

        <!-- Checkbox -->
        <div class="d-flex align-items-s gap-3">
          <div class="form-check form-switch custom-checkbox my-0">
            <input class="form-check-input" type="checkbox" id="buscar-denominacion"
              style="border-top-width: 0px !important; margin-top: 0px !important">
            <label class="form-check-label ms-2" for="buscar-denominacion">Buscar por Razón social</label>
          </div>
        </div>

        <!-- Botón Buscar -->
        <div class="d-flex align-items-center justify-content-center mx-auto" style="min-width: 18%;">
          <button onclick="buscarProveedor()" class="d-flex justify-content-center btn boton-producto w-100"
            style="padding-top: 12px !important; padding-bottom: 12px !important;">
            <i class="fas fa-search me-2"></i> Buscar
          </button>
        </div>
      </div>

      <!-- Resultado búsqueda -->
      <p id="mensaje-error" style="color: red; display: none; margin-top: .5rem;"></p>

      <table id="tabla-proveedor" class="table table-hover mt-4" style="display: none">
        <thead class="table-light">
          <tr>
            <th class="primero">Nombre</th>
            <th>Denominación</th>
            <th>Documento</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th class="ultimo">Dirección</th>
          </tr>
        </thead>
        <tbody id="tabla-proveedor-body"></tbody>
      </table>
    </section>

    <!-- Listado completo -->
    <section class="dashboard-section">
      <h2 class="mb-4"><i class="fas fa-address-book"></i> Lista de Proveedores</h2>
      <table id="tabla-estatica" class="table table-hover">
        <thead class="table-light">
          <tr>
            <th class="primero">Nombre</th>
            <th>RUT</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>E-mail</th>
            <th class="ultimo">Denominación</th>
          </tr>
        </thead>
        <tbody id="proveedoresBody"><!-- Se carga vía JS --></tbody>
      </table>
    </section>
  </div>

  <script src="../js/proveedores-unificado.js"></script>
</body>

</html>
