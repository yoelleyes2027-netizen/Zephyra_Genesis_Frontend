<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agregar Producto</title>
  <link rel="stylesheet" href="../css/agregar-producto.css" />
</head>
<body>
  <div class="form-container">
    <h1>Agregar nuevo producto</h1>
    <form id="form-agregar-producto">
      <label for="codigo">Código:</label>
      <input type="text" id="codigo" name="codigo" required />

      <label for="descripcion">Descripción:</label>
      <input type="text" id="descripcion" name="descripcion" required />

      <label for="precio_venta">Precio de venta:</label>
      <input type="number" id="precio_venta" name="precio_venta" step="0.01" required />

      <label for="precio_compra">Precio de compra:</label>
      <input type="number" id="precio_compra" name="precio_compra" step="0.01" required />

      <label for="unidad_medida">Unidad de medida:</label>
      <input type="text" id="unidad_medida" name="unidad_medida" required />

      <label for="etiqueta_id">ID de etiqueta:</label>
      <input type="number" id="etiqueta_id" name="etiqueta_id" required />

      <label for="proveedor_id">ID de proveedor:</label>
      <input type="number" id="proveedor_id" name="proveedor_id" required />

      <button type="submit">Agregar producto</button>
    </form>
    <div id="mensaje"></div>
  </div>

  <script src="../js/agregar-producto.js"></script>
</body>
</html>
