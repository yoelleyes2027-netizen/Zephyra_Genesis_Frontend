<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devolver ticket - Genesis</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/venta-caja.css">
</head>

<body class="cash-register">
  <main class="container" aria-labelledby="devolucion-title">
    <h1 id="devolucion-title">Devolver ticket</h1>

    <section id="autorizacion-panel" class="cash-panel" aria-labelledby="autorizacion-title">
      <h2 id="autorizacion-title">Autorización requerida</h2>
      <p>Un administrador de esta BDD debe aprobar la devolución antes de continuar.</p>
      <form id="autorizacion-form" class="cash-inline-form">
        <div><label for="autorizacion-cedula">Cédula de administrador</label><input id="autorizacion-cedula" type="number" inputmode="numeric" required></div>
        <div><label for="autorizacion-password">Contraseña</label><input id="autorizacion-password" type="password" autocomplete="current-password" required></div>
        <button type="submit">Solicitar autorización</button>
      </form>
      <p id="autorizacion-mensaje" class="cash-message" role="alert" aria-live="polite"></p>
    </section>

    <section id="buscar-ticket-panel" class="cash-panel" hidden aria-labelledby="buscar-ticket-title">
      <h2 id="buscar-ticket-title">Buscar ticket</h2>
      <form id="buscar-ticket-form" class="cash-inline-form">
        <div><label for="ticket-id">Nro de ticket</label><input id="ticket-id" type="number" min="1" required></div>
        <button type="submit">Buscar ticket</button>
      </form>
      <p id="ticket-mensaje" class="cash-message" role="alert" aria-live="polite"></p>
    </section>

    <section id="ticket-detalle-panel" class="cash-panel" hidden aria-labelledby="ticket-detalle-title">
      <h2 id="ticket-detalle-title">Datos del ticket</h2>
      <dl id="ticket-datos" class="cash-summary"></dl>
      <div class="table-scroll">
        <table id="ticket-detalle-tabla">
          <thead><tr><th>Producto</th><th>Precio unitario</th><th>Cantidad</th><th>Subtotal</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="cash-actions"><button id="iniciar-devolucion" type="button">Devolver</button></div>
    </section>
    <div class="cash-footer-actions"><button id="volver-panel" type="button">Volver</button></div>
  </main>

  <section id="modal-pago-devolucion" class="cash-modal" hidden aria-labelledby="pago-devolucion-title">
    <div class="cash-modal__panel">
      <h2 id="pago-devolucion-title">Cortar devolución</h2>
      <p>Selecciona la forma en que se reintegra el importe.</p>
      <div class="cash-options" role="radiogroup" aria-label="Forma de pago de devolución">
        <label><input type="radio" name="forma-pago-devolucion" value="EFECTIVO" checked> Efectivo</label>
        <label><input type="radio" name="forma-pago-devolucion" value="TARJETA"> Tarjeta</label>
        <label><input type="radio" name="forma-pago-devolucion" value="TRANSFERENCIA"> Transferencia</label>
      </div>
      <p id="devolucion-mensaje" class="cash-message" role="alert" aria-live="polite"></p>
      <div class="cash-actions"><button id="finalizar-devolucion" type="button">Finalizar devolución</button><button id="cancelar-devolucion" type="button">Volver</button></div>
    </div>
  </section>

  <script src="../js/devolucion.js"></script>
</body>

</html>
