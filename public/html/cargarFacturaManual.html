<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar factura - Genesis</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
  <main class="dashboard-container container">
    <header class="dashboard-header d-flex align-items-center justify-content-between">
      <button id="btn-volver" class="logo border-0" type="button" aria-label="Volver a Facturas">G</button>
      <h1 class="mb-0">Cargar factura</h1>
    </header>

    <section class="dashboard-section mb-4" aria-label="Datos de factura">
      <h2 class="mb-3">Datos de factura</h2>
      <div class="row g-3 align-items-end">
        <div class="col-md-5">
          <label for="proveedor" class="form-label">Proveedor</label>
          <select id="proveedor" class="form-select" required>
            <option value="">Selecciona un proveedor</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="moneda" class="form-label">Moneda</label>
          <select id="moneda" class="form-select" required>
            <option value="UYU">UYU</option>
            <option value="USD">USD</option>
          </select>
        </div>
        <div class="col-md-2">
          <div class="form-check mb-2">
            <input id="tiene-serie" class="form-check-input" type="checkbox">
            <label class="form-check-label" for="tiene-serie">Tiene numero de serie</label>
          </div>
        </div>
        <div id="serie-field" class="col-md-3" hidden>
          <label for="nro-serie" class="form-label">Numero de serie</label>
          <input id="nro-serie" class="form-control" type="text" maxlength="255">
        </div>
      </div>
    </section>

    <section class="dashboard-section mb-4" aria-labelledby="buscar-title">
      <h2 id="buscar-title" class="mb-1">Productos del proveedor</h2>
      <p class="text-muted mb-3">Busca por codigo, descripcion o etiqueta.</p>
      <div class="row g-2">
        <div class="col-md-7">
          <label for="busqueda" class="form-label">Buscar producto</label>
          <input id="busqueda" class="form-control" type="search" placeholder="Codigo, descripcion o etiqueta" disabled>
        </div>
      </div>
      <p id="busqueda-ayuda" class="text-muted small mt-2 mb-0">Selecciona un proveedor para buscar productos.</p>
      <div id="resultados" class="list-group mt-3" aria-live="polite"></div>
    </section>

    <section class="dashboard-section mb-4" aria-labelledby="detalle-title">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div>
          <h2 id="detalle-title" class="mb-1">Detalle de factura</h2>
          <p id="detalle-vacio" class="text-muted mb-0">Aun no agregaste productos.</p>
        </div>
        <strong id="total" class="text-primary fs-5">UYU 0.00</strong>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Precio compra</th>
              <th>Cantidad</th>
              <th>Subtotal</th>
              <th aria-label="Acciones"></th>
            </tr>
          </thead>
          <tbody id="detalle-body"></tbody>
        </table>
      </div>
    </section>

    <p id="mensaje" class="mb-3" role="alert" aria-live="polite"></p>
    <footer class="dashboard-footer">
      <button id="btn-cargar" class="btn btn-primary" type="button" disabled><i class="fas fa-floppy-disk" aria-hidden="true"></i> Cargar factura</button>
    </footer>
  </main>

  <dialog id="editar-dialog">
    <form id="editar-form" method="dialog">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Editar producto</h2>
        <button id="btn-cerrar-edicion" class="btn-close" type="button" aria-label="Cerrar"></button>
      </div>
      <p id="editar-producto" class="text-muted"></p>
      <div class="mb-3">
        <label for="editar-cantidad" class="form-label">Cantidad</label>
        <input id="editar-cantidad" class="form-control" type="number" min="1" step="1" required>
      </div>
      <div class="mb-3">
        <label for="editar-precio" class="form-label">Precio de compra</label>
        <input id="editar-precio" class="form-control" type="number" min="0" step="0.01" required>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <button id="btn-cancelar-edicion" class="btn btn-light" type="button">Cancelar</button>
        <button class="btn btn-primary" type="submit">Guardar cambios</button>
      </div>
    </form>
  </dialog>

  <script src="../js/cargarFacturaManual.js"></script>
</body>

</html>
