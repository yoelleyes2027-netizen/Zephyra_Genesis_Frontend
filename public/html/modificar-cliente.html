<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modificar Cliente</title>
  <link rel="stylesheet" href="../css/modificar-cliente.css" />
</head>
<body>
  <div class="form-container">
    <h1>Modificar Cliente</h1>

    <!-- Buscador -->
    <form id="formBuscar">
      <label for="documentoBuscar">Buscar por documento:</label>
      <input type="text" id="documentoBuscar" required />
      <button type="submit">Buscar</button>
    </form>

    <!-- Formulario de modificación -->
    <form id="formModificar" style="display: none; margin-top: 20px;">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" />
      </div>

      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" />
      </div>

      <button type="submit">Actualizar Cliente</button>
    </form>

    <!-- Mensajes -->
    <p id="mensaje"></p>
  </div>

  <script src="../js/modificar-cliente.js"></script>
</body>
</html>
