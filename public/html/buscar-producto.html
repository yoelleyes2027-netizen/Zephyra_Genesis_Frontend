<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscar Producto</title>
  <link rel="stylesheet" href="../css/buscar-producto.css">
</head>
<body>
  <div class="producto-container">
    <h1>Buscar Producto</h1>

    <!-- ✅ NUEVO -->
  <label style="display: block; margin-top: 1rem;">
    <input type="checkbox" id="buscar-descripcion">
    Buscar por descripción
  </label>

    <input type="text" id="codigo-input" placeholder="Código del producto">
    <button onclick="buscarProducto()">Buscar</button>

    <table id="tabla-producto" style="display: none;">
      <thead>
        <tr>
          <th>Código</th>
          <th>Descripción</th>
          <th>Precio Venta</th>
          <th>Precio Compra</th>
          <th>Stock</th>
          <th>Unidad</th>
          <th>Etiqueta</th>
          <th>Proveedor</th>
        </tr>
      </thead>
      <tbody id="tabla-producto-body"></tbody>
    </table>

    <p id="mensaje-error" style="color: red; display: none;"></p>
  </div>

  <script src="../js/buscar-producto.js"></script>
</body>
</html>
