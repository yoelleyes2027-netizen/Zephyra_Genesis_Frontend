<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin del Sistema - Genesis</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    .support-modal {
      position: fixed;
      inset: 0;
      z-index: 1050;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .support-modal.d-none {
      display: none !important;
    }

    .support-modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 13, 28, 0.68);
      backdrop-filter: blur(4px);
    }

    .support-modal__panel {
      position: relative;
      width: min(940px, 100%);
      max-height: 90vh;
      overflow: auto;
      border: 0;
      border-radius: 1.25rem;
    }
  </style>
</head>

<body>
  <div class="dashboard-container container">
    <div class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo" onclick="window.location.href='./adminUsuario.html'">G</div>
      <h1 class="mb-0">Admin del Sistema</h1>
    </div>

    <section class="dashboard-section mb-4">
      <h2 class="mb-3">Crear usuario</h2>
      <form id="usuario-form" class="row g-3">
        <div class="col-md-4"><input id="usuario-nombre" class="form-control" placeholder="Nombre completo" required></div>
        <div class="col-md-2"><input id="usuario-cedula" type="number" class="form-control" placeholder="Cédula" required></div>
        <div class="col-md-2">
          <div class="input-group">
            <input id="usuario-password" type="password" class="form-control" placeholder="Contraseña" minlength="8" pattern="(?=.*[A-Z])(?=.*\d).{8,}" title="Debe tener al menos 8 caracteres, una mayúscula y un número" required autocomplete="new-password">
            <button class="btn btn-outline-secondary" type="button" id="toggle-usuario-password" aria-label="Mostrar contraseña">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <small class="text-muted d-block mt-1">Mínimo 8 caracteres, una mayúscula y un número.</small>
          <small id="usuario-password-error" class="text-danger d-block mt-1" aria-live="polite"></small>
        </div>
        <div class="col-md-2"><select id="usuario-rol" class="form-select"><option value="" selected>Seleccionar rol...</option><option value="ADMIN">Admin</option><option value="RECEPCION">Recepción</option><option value="CAJERO">Cajero</option></select></div>
        <div class="col-md-2">
          <select id="usuario-db" class="form-select" required>
            <option value="">Cargando BDD...</option>
          </select>
        </div>
        <div class="col-md-4"><input id="usuario-email" type="email" class="form-control" placeholder="Email"></div>
        <div class="col-md-2"><input id="usuario-telefono" type="number" class="form-control" placeholder="Teléfono"></div>
        <div class="col-12 d-flex gap-2">
          <button class="btn btn-primary" type="submit">Guardar usuario</button>
        </div>
      </form>
      <div id="admin-sistema-mensaje" class="mt-3"></div>
    </section>

    <section class="dashboard-section">
      <h2 class="mb-3">Soporte por tabla</h2>
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <select id="base-soporte" class="form-select">
            <option value="">Seleccionar BDD...</option>
          </select>
        </div>
        <div class="col-md-4">
          <select id="tabla-soporte" class="form-select" disabled>
            <option value="">Seleccionar tabla...</option>
          </select>
        </div>
        <div class="col-md-3"><button id="cargar-soporte" class="btn btn-light w-100">Cargar tabla</button></div>
      </div>
      <div class="table-responsive mt-4">
        <table class="table table-hover align-middle">
          <thead id="soporte-head"></thead>
          <tbody id="soporte-body"></tbody>
        </table>
      </div>
    </section>

    <div id="soporte-edit-modal" class="support-modal d-none" aria-hidden="true">
      <div class="support-modal__backdrop" data-soporte-close></div>
      <div class="support-modal__panel card shadow-lg">
        <div class="card-header d-flex align-items-center justify-content-between">
          <div>
            <h3 id="soporte-edit-title" class="h5 mb-0">Editar registro</h3>
            <small class="text-muted">Ajusta los campos y guarda los cambios en la BDD seleccionada</small>
          </div>
          <button type="button" class="btn-close" aria-label="Cerrar" data-soporte-close></button>
        </div>
        <form id="soporte-edit-form">
          <div id="soporte-edit-body" class="card-body"></div>
          <div class="card-footer d-flex gap-2 justify-content-end">
            <button type="button" class="btn btn-light" data-soporte-close>Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>

    <div class="dashboard-footer">
      <button id="logout-btn" class="btn dashboard-logout" type="button"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Cerrar sesión</button>
    </div>
  </div>

  <script src="../js/admin-sistema.js"></script>
</body>

</html>
