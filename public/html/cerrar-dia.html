<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerrar día - Genesis</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
  <main class="dashboard-container container">
    <header class="dashboard-header d-flex align-items-center justify-content-between">
      <div class="logo" aria-hidden="true">G</div>
      <h1 class="mb-0">Cerrar día</h1>
    </header>

    <section class="dashboard-section">
      <h2 class="mb-2">Cierre global del día</h2>
      <p class="text-muted mb-4">Esta acción calcula los totales de caja global y limpia la tabla caja_diaria.</p>
      <div class="dashboard-menu d-flex flex-wrap gap-3">
        <button id="btn-cerrar-dia" class="btn btn-light shadow-sm flex-fill" type="button">
          <i class="fas fa-calendar-check" aria-hidden="true"></i> Cerrar día
        </button>
      </div>
    </section>

    <footer class="dashboard-footer d-flex gap-2">
      <button id="btn-volver" class="btn dashboard-logout" type="button"><i class="fas fa-arrow-left" aria-hidden="true"></i> Volver</button>
      <button id="logout-btn" class="btn dashboard-logout" type="button"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Cerrar sesión</button>
    </footer>
  </main>

  <script src="../js/dashboard.js"></script>
  <script src="../js/cerrar-dia.js"></script>
</body>

</html>
