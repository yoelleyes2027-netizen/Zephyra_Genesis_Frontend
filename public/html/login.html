<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis | Iniciar sesión</title>

  <!-- Bootstrap y estilos -->
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/all.min.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">
  <button id="theme-toggle" class="btn theme-toggle" type="button" aria-label="Activar tema oscuro">
    <i class="fas fa-moon" aria-hidden="true"></i><span>Oscuro</span>
  </button>

  <main class="login-page__content">
    <header class="login-brand" aria-label="Genesis, sistema de gestión para supermercados">
      <div class="login-brand__mark" aria-hidden="true">
        <span>G</span><i class="fas fa-shopping-cart"></i>
      </div>
      <p class="login-brand__name">GENESIS</p>
      <p class="login-brand__tagline">Sistema de gestión para supermercados</p>
    </header>

    <section class="login-card login-container" id="login-container" aria-labelledby="login-title">
      <div class="login-card__icon" aria-hidden="true"><i class="far fa-user"></i></div>
      <div class="login-card__heading">
        <h1 id="login-title">Iniciar sesión</h1>
      </div>

      <form class="login-form" id="login-form">
        <div class="login-form__field">
          <label for="cedula">Cédula</label>
          <div class="login-form__control">
            <i class="far fa-id-card" aria-hidden="true"></i>
            <input type="text" id="cedula" name="cedula" class="form-control" placeholder="Ingrese su cédula" autocomplete="username" required>
          </div>
        </div>

        <div class="login-form__field">
          <label for="contraseña">Contraseña</label>
          <div class="login-form__control">
            <i class="fas fa-lock" aria-hidden="true"></i>
            <input type="password" id="contraseña" name="contraseña" class="form-control" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
            <button class="login-form__password-toggle" type="button" id="toggle-contraseña" aria-label="Mostrar contraseña">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button id="ingresar" type="submit" class="btn login-form__submit">
          <span class="login-form__submit-icon" aria-hidden="true"><i class="fas fa-sign-in-alt"></i></span>
          <span class="login-form__submit-text">Ingresar</span>
          <i class="fas fa-arrow-right login-form__submit-arrow" aria-hidden="true"></i>
        </button>
      </form>

      <div id="mensaje-error" role="alert" aria-live="polite"></div>
    </section>
  </main>

  <footer class="login-page__footer">Zephyra</footer>

  <script src="../js/login.js"></script>
</body>

</html>
