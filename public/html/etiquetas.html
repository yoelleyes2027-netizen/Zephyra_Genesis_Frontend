<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Etiqueta</title>
  <link rel="stylesheet" href="../css/etiquetas.css">
</head>
<body>
  <div class="container">
    <h2>Agregar nueva etiqueta</h2>
    <form id="form-etiqueta">
      <label for="nombre">Nombre de la etiqueta</label>
      <input type="text" id="nombre" name="nombre" required>
      <button type="submit">Agregar</button>
    </form>

    <div id="mensaje-respuesta"></div>
  </div>

  <script src="../js/etiquetas.js"></script>
</body>
</html>
